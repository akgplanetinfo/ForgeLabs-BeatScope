name: ForgeLabs BeatScope Windows EXE

on:
  push:
    branches: [main, 'feature/project-bundles-alpha15', 'feature/lumina-alpha17-stage1']
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: 'false'
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check source and run tests
        run: npm run check

      - name: Test real Electron UI and GPU shader rendering
        shell: pwsh
        run: node -e "const cp=require('child_process'); const p=require('electron'); const a=cp.spawnSync(p,['tests/electron-smoke.cjs'],{encoding:'utf8',timeout:120000});process.stdout.write(a.stdout||'');process.stderr.write(a.stderr||'');process.exit(a.status||(!a.error?0:1))"

      - name: Build Windows installer and portable application
        run: npm run dist:win -- --publish never

      - name: Verify generated EXE files
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path dist -Filter 'ForgeLabs-BeatScope-Setup-*-x64.exe' -File
          $portable  = Get-ChildItem -Path dist -Filter 'ForgeLabs-BeatScope-Portable-*-x64.exe' -File
          if ($installer.Count -ne 1 -or $portable.Count -ne 1) {
            throw 'Hianyzik a telepito vagy a portable EXE.'
          }
          foreach ($file in @($installer) + @($portable)) {
            Write-Host "$($file.Name) - $($file.Length) bytes"
            Get-FileHash -Algorithm SHA256 -LiteralPath $file.FullName | Format-List
          }

      - name: Save EXE build as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ForgeLabs-BeatScope-Windows-EXE
          path: |
            dist/ForgeLabs-BeatScope-Setup-*-x64.exe
            dist/ForgeLabs-BeatScope-Portable-*-x64.exe
          if-no-files-found: error
          retention-days: 30

      - name: Validate UNPUBLISHED Lumina release candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = node -p "require('./package.json').version"
          $installer = @(Get-ChildItem -Path dist -Filter 'ForgeLabs-BeatScope-Setup-*-x64.exe' -File)
          $portable = @(Get-ChildItem -Path dist -Filter 'ForgeLabs-BeatScope-Portable-*-x64.exe' -File)
          if ($installer.Count -ne 1 -or $portable.Count -ne 1) { throw 'Expected exactly one installer and portable EXE' }
          node scripts/release-candidate.cjs --app-id lumina --version $version --channel beta --exe "$($installer[0].FullName)" --exe "$($portable[0].FullName)" --output release-candidates.json
          if ($LASTEXITCODE -ne 0) { throw 'Candidate verification failed' }

      - name: Archive unpublished candidate report
        uses: actions/upload-artifact@v4
        with:
          name: Lumina-Pulse-Release-Candidate
          path: release-candidates.json
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release with direct EXE downloads
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "ForgeLabs BeatScope ${TAG}" --notes "Windows x64 telepito (csak sajat felhasznalo, adminjog nelkul) es hordozhato EXE. A binarisok nem kodalairtak; Windows SmartScreen figyelmeztethet." --target "$GITHUB_SHA"
          fi
          gh release upload "$TAG" dist/ForgeLabs-BeatScope-Setup-*-x64.exe dist/ForgeLabs-BeatScope-Portable-*-x64.exe --clobber