name: ForgeLabs BeatScope Windows EXE

on:
  push:
    branches: [main, 'feature/project-bundles-alpha15', 'feature/lumina-alpha17-stage1']
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: 'false'
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check source and run tests
        run: npm run check

      - name: Test real Electron UI and GPU shader rendering
        shell: pwsh
        run: node -e "const cp=require('child_process'); const p=require('electron'); const a=cp.spawnSync(p,['tests/electron-smoke.cjs'],{encoding:'utf8',timeout:120000});process.stdout.write(a.stdout||'');process.stderr.write(a.stderr||'');process.exit(a.status||(!a.error?0:1))"

      - name: Build Windows installer and portable application
        run: npm run dist:win -- --publish never

      - name: Verify generated EXE files
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path dist -Filter 'ForgeLabs-BeatScope-Setup-*-x64.exe' -File
          $portable  = Get-ChildItem -Path dist -Filter 'ForgeLabs-BeatScope-Portable-*-x64.exe' -File
          if ($installer.Count -ne 1 -or $portable.Count -ne 1) {
            throw 'Hianyzik a telepito vagy a portable EXE.'
          }
          foreach ($file in @($installer) + @($portable)) {
            Write-Host "$($file.Name) - $($file.Length) bytes"
            Get-FileHash -Algorithm SHA256 -LiteralPath $file.FullName | Format-List
          }

      - name: Generate SHA256 checksums for verified binaries
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -Path dist -Filter 'ForgeLabs-BeatScope-*-x64.exe' -File | Sort-Object Name)
          if ($files.Count -ne 2) { throw 'A stabil kiadashoz ket EXE kell.' }
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file.FullName).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          [System.IO.File]::WriteAllLines(
            (Join-Path (Resolve-Path dist) 'SHA256SUMS.txt'),
            [string[]]$lines,
            [System.Text.UTF8Encoding]::new($false)
          )

      - name: Save EXE build as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ForgeLabs-BeatScope-Windows-EXE
          path: |
            dist/ForgeLabs-BeatScope-Setup-*-x64.exe
            dist/ForgeLabs-BeatScope-Portable-*-x64.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release with direct EXE downloads
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          if [[ "$VERSION" == *-* ]]; then
            echo "Stable release version required" >&2
            exit 1
          fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Lumina Pulse | BeatScope Edition $TAG" --notes-file RELEASE_NOTES.md --target "$GITHUB_SHA" --latest
          fi
          gh release upload "$TAG" dist/ForgeLabs-BeatScope-Setup-*-x64.exe dist/ForgeLabs-BeatScope-Portable-*-x64.exe dist/SHA256SUMS.txt --clobber
